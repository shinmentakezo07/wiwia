<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-label="wiwi hub-and-spoke architecture: three inbound dialects decode into one canonical IR, which the router dispatches to twelve outbound providers">
  <defs>
    <radialGradient id="ha" cx="12%" cy="18%" r="52%"><stop offset="0" stop-color="#6366f1" stop-opacity=".30"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="hb" cx="88%" cy="82%" r="55%"><stop offset="0" stop-color="#a855f7" stop-opacity=".24"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="240" y1="0" x2="1030" y2="0"><stop offset="0" stop-color="#6366f1" stop-opacity=".5"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef" stop-opacity=".6"/></linearGradient>
    <linearGradient id="irbox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151527"/><stop offset="1" stop-color="#0d0d18"/></linearGradient>
    <linearGradient id="wiwi-brand" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="660" fill="#07070c"/>
  <rect width="1280" height="660" fill="url(#ha)"/>
  <rect width="1280" height="660" fill="url(#hb)"/>

  <!-- mark -->
  <g transform="translate(40 34)">
    <rect width="40" height="40" rx="10" fill="url(#wiwi-brand)"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="scale(.625)">
      <polyline points="11,24 19.5,41 28,24 36.5,41 45,24 53,38"/>
    </g>
  </g>
  <text x="94" y="52" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" fill="#f4f4f6">Hub and spoke</text>
  <text x="94" y="70" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="500" fill="#8b93a5" letter-spacing=".3">Every request crosses the IR exactly once — in the client&#8217;s dialect out, in the client&#8217;s dialect back.</text>

  <!-- column labels -->
  <text x="40" y="152" font-family="ui-monospace,Menlo,monospace" font-size="11.5" letter-spacing="1.5" fill="#6b7280">INBOUND · 3 DIALECTS</text>
  <text x="630" y="152" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11.5" letter-spacing="1.5" fill="#818cf8">TRANSLATION CORE</text>
  <text x="1125" y="152" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11.5" letter-spacing="1.5" fill="#6b7280">OUTBOUND · 12 PROVIDERS</text>

  <!-- inbound cards -->
  <g>
    <rect x="40" y="185" width="200" height="130" rx="14" fill="#0e0e16" stroke="#ffffff" stroke-opacity=".10"/>
    <rect x="40" y="185" width="3" height="130" rx="1.5" fill="#10a37f"/>
    <text x="60" y="222" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#e5e7eb">/v1/chat/completions</text>
    <text x="60" y="248" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#34d399">OpenAI Chat</text>
    <text x="60" y="272" font-family="Inter,Arial,sans-serif" font-size="11" fill="#8b93a5">openai SDK · LangChain</text>
    <text x="60" y="290" font-family="Inter,Arial,sans-serif" font-size="11" fill="#8b93a5">Vercel AI SDK · curl</text>
  </g>
  <g>
    <rect x="40" y="344" width="200" height="130" rx="14" fill="#0e0e16" stroke="#ffffff" stroke-opacity=".10"/>
    <rect x="40" y="344" width="3" height="130" rx="1.5" fill="#a78bfa"/>
    <text x="60" y="381" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#e5e7eb">/v1/responses</text>
    <text x="60" y="407" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#a78bfa">OpenAI Responses</text>
    <text x="60" y="431" font-family="Inter,Arial,sans-serif" font-size="11" fill="#8b93a5">Codex CLI</text>
    <text x="60" y="449" font-family="Inter,Arial,sans-serif" font-size="11" fill="#8b93a5">Agents SDK</text>
  </g>
  <g>
    <rect x="40" y="503" width="200" height="130" rx="14" fill="#0e0e16" stroke="#ffffff" stroke-opacity=".10"/>
    <rect x="40" y="503" width="3" height="130" rx="1.5" fill="#cc7c5e"/>
    <text x="60" y="540" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#e5e7eb">/v1/messages</text>
    <text x="60" y="566" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#f0a58a">Anthropic Messages</text>
    <text x="60" y="590" font-family="Inter,Arial,sans-serif" font-size="11" fill="#8b93a5">Claude Code</text>
    <text x="60" y="608" font-family="Inter,Arial,sans-serif" font-size="11" fill="#8b93a5">anthropic SDK</text>
  </g>

  <!-- inbound connectors -->
  <g fill="none" stroke="url(#beam)" stroke-width="1.7" opacity=".7">
    <path d="M 240 250 C 330 250 330 260 420 260"/>
    <path d="M 240 409 C 330 409 330 409 420 409"/>
    <path d="M 240 568 C 330 568 330 558 420 558"/>
  </g>

  <!-- IR core -->
  <rect x="420" y="185" width="420" height="448" rx="18" fill="url(#irbox)" stroke="#6366f1" stroke-opacity=".55" stroke-width="1.6"/>
  <text x="630" y="222" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14" letter-spacing="2" fill="#a5b4fc">CANONICAL IR</text>
  <line x1="444" y1="244" x2="816" y2="244" stroke="#312e81" stroke-width="1"/>

  <g font-family="ui-monospace,Menlo,monospace" font-size="11.5">
    <text x="452" y="276" fill="#818cf8">▸ decode</text>
    <text x="452" y="298" fill="#94a3b8">wire/{chat,responses,messages}</text>
    <text x="452" y="320" fill="#e2e8f0">→ IRRequest</text>

    <text x="452" y="352" fill="#818cf8">▸ execute</text>
    <text x="452" y="374" fill="#94a3b8">auth · budgets · rate limits</text>
    <text x="452" y="396" fill="#94a3b8">WRR key pools · retries</text>
    <text x="452" y="418" fill="#94a3b8">cooldowns · fallbacks</text>
    <text x="452" y="440" fill="#e2e8f0">→ provider adapter</text>

    <text x="452" y="472" fill="#818cf8">▸ encode</text>
    <text x="452" y="494" fill="#94a3b8">IRStreamDelta* → wire</text>
    <text x="452" y="516" fill="#e2e8f0">back in the caller&#8217;s dialect</text>
  </g>

  <line x1="444" y1="540" x2="816" y2="540" stroke="#312e81" stroke-width="1"/>
  <text x="630" y="570" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#a78bfa">N×M coverage from N+M modules</text>
  <text x="630" y="594" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#6b7280">core never branches on dialect or provider name</text>

  <!-- outbound fan -->
  <g fill="none" stroke="url(#beam)" stroke-width="1.6" opacity=".65">
    <path d="M 840 409 C 900 409 930 409 975 409"/>
    <line x1="975" y1="200" x2="975" y2="618"/>
    <line x1="975" y1="200" x2="1030" y2="200"/><line x1="975" y1="238" x2="1030" y2="238"/>
    <line x1="975" y1="276" x2="1030" y2="276"/><line x1="975" y1="314" x2="1030" y2="314"/>
    <line x1="975" y1="352" x2="1030" y2="352"/><line x1="975" y1="390" x2="1030" y2="390"/>
    <line x1="975" y1="428" x2="1030" y2="428"/><line x1="975" y1="466" x2="1030" y2="466"/>
    <line x1="975" y1="504" x2="1030" y2="504"/><line x1="975" y1="542" x2="1030" y2="542"/>
    <line x1="975" y1="580" x2="1030" y2="580"/><line x1="975" y1="618" x2="1030" y2="618"/>
  </g>

  <!-- provider chips -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="11.5">
    <g><rect x="1030" y="185" width="190" height="30" rx="8" fill="#101018" stroke="#ffffff" stroke-opacity=".09"/><text x="1046" y="205" fill="#cbd5e1">openai</text></g>
    <g><rect x="1030" y="223" width="190" height="30" rx="8" fill="#101018" stroke="#ffffff" stroke-opacity=".09"/><text x="1046" y="243" fill="#cbd5e1">anthropic</text></g>
    <g><rect x="1030" y="261" width="190" height="30" rx="8" fill="#101018" stroke="#ffffff" stroke-opacity=".09"/><text x="1046" y="281" fill="#cbd5e1">gemini</text></g>
    <g><rect x="1030" y="299" width="190" height="30" rx="8" fill="#101018" stroke="#ffffff" stroke-opacity=".09"/><text x="1046" y="319" fill="#cbd5e1">openrouter</text></g>
    <g><rect x="1030" y="337" width="190" height="30" rx="8" fill="#101018" stroke="#ffffff" stroke-opacity=".09"/><text x="1046" y="357" fill="#cbd5e1">gmicloud</text></g>
    <g><rect x="1030" y="375" width="190" height="30" rx="8" fill="#101018" stroke="#ffffff" stroke-opacity=".09"/><text x="1046" y="395" fill="#cbd5e1">bai</text></g>
    <g><rect x="1030" y="413" width="190" height="30" rx="8" fill="#101018" stroke="#ffffff" stroke-opacity=".09"/><text x="1046" y="433" fill="#cbd5e1">nvidia-nim</text></g>
    <g><rect x="1030" y="451" width="190" height="30" rx="8" fill="#101018" stroke="#ffffff" stroke-opacity=".09"/><text x="1046" y="471" fill="#cbd5e1">cline</text></g>
    <g><rect x="1030" y="489" width="190" height="30" rx="8" fill="#101018" stroke="#ffffff" stroke-opacity=".09"/><text x="1046" y="509" fill="#cbd5e1">workbuddy</text></g>
    <g><rect x="1030" y="527" width="190" height="30" rx="8" fill="#101018" stroke="#ffffff" stroke-opacity=".09"/><text x="1046" y="547" fill="#cbd5e1">opencode</text></g>
    <g><rect x="1030" y="565" width="190" height="30" rx="8" fill="#101018" stroke="#ffffff" stroke-opacity=".09"/><text x="1046" y="585" fill="#cbd5e1">hermes</text></g>
    <g><rect x="1030" y="603" width="190" height="30" rx="8" fill="#101018" stroke="#a78bfa" stroke-opacity=".35"/><text x="1046" y="623" fill="#a78bfa">+ openai-compatible</text></g>
  </g>
</svg>
