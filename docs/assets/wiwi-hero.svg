<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-label="wiwi — one gateway, every dialect, any provider. Three inbound dialects decode into one canonical IR, which dispatches to twelve outbound providers.">
  <defs>
    <radialGradient id="g1" cx="15%" cy="22%" r="55%"><stop offset="0" stop-color="#6366f1" stop-opacity=".34"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="86%" cy="80%" r="58%"><stop offset="0" stop-color="#a855f7" stop-opacity=".26"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3" cx="56%" cy="4%" r="46%"><stop offset="0" stop-color="#3b82f6" stop-opacity=".18"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0v64" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="288" y1="0" x2="756" y2="0"><stop offset="0" stop-color="#6366f1" stop-opacity=".35"/><stop offset=".5" stop-color="#8b5cf6" stop-opacity=".9"/><stop offset="1" stop-color="#d946ef" stop-opacity=".45"/></linearGradient>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="56" y2="56"><stop offset="0" stop-color="#6366f1"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="1280" y2="470"><stop offset="0" stop-color="#6366f1"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
  </defs>

  <rect width="1280" height="500" fill="#07070c"/>
  <rect width="1280" height="500" fill="url(#grid)"/>
  <rect width="1280" height="500" fill="url(#g1)"/>
  <rect width="1280" height="500" fill="url(#g2)"/>
  <rect width="1280" height="500" fill="url(#g3)"/>

  <!-- the wiwi wave motif, whisper-quiet behind everything -->
  <path d="M -60 500 L 130 320 L 320 500 L 510 320 L 700 500 L 890 320 L 1080 500 L 1270 320"
        fill="none" stroke="url(#wave)" stroke-opacity=".05" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- mark -->
  <g transform="translate(58 38)">
    <rect width="56" height="56" rx="14" fill="url(#brand)"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" transform="scale(.875)">
      <polyline points="11,24 19.5,41 28,24 36.5,41 45,24 53,38"/>
    </g>
    <g fill="#ffffff" transform="scale(.875)">
      <circle cx="11" cy="24" r="2.6"/><circle cx="28" cy="24" r="2.6"/><circle cx="45" cy="24" r="2.6"/>
      <circle cx="53" cy="38" r="2.6" fill-opacity=".85"/>
    </g>
  </g>
  <text x="134" y="78" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="800" fill="#f4f4f6">wi<tspan fill="#a78bfa">wi</tspan></text>
  <text x="136" y="104" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#8b93a5" letter-spacing="2.6">ONE GATEWAY · EVERY DIALECT · ANY PROVIDER</text>

  <text x="1240" y="72" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="12" letter-spacing="1.4" fill="#6b7280">3 INBOUND × 12 OUTBOUND</text>
  <text x="1240" y="96" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="12" letter-spacing="1.4" fill="#a78bfa">ALL 36 COMBINATIONS</text>

  <!-- section labels -->
  <text x="58" y="158" font-family="ui-monospace,Menlo,monospace" font-size="11" letter-spacing="1.6" fill="#6b7280">INBOUND · 3 DIALECTS</text>
  <text x="527" y="158" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" letter-spacing="1.6" fill="#818cf8">TRANSLATION CORE</text>
  <text x="998" y="158" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" letter-spacing="1.6" fill="#6b7280">OUTBOUND · 12 PROVIDERS</text>

  <!-- inbound cards -->
  <g>
    <rect x="58" y="176" width="230" height="86" rx="14" fill="#0e0e16" stroke="#ffffff" stroke-opacity=".09"/>
    <rect x="58" y="176" width="3" height="86" rx="1.5" fill="#10a37f"/>
    <text x="78" y="205" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#e5e7eb">/v1/chat/completions</text>
    <text x="78" y="229" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#34d399">OpenAI Chat</text>
    <text x="78" y="250" font-family="Inter,Arial,sans-serif" font-size="11" fill="#8b93a5">openai SDK · LangChain · curl</text>
  </g>
  <g>
    <rect x="58" y="272" width="230" height="86" rx="14" fill="#0e0e16" stroke="#ffffff" stroke-opacity=".09"/>
    <rect x="58" y="272" width="3" height="86" rx="1.5" fill="#a78bfa"/>
    <text x="78" y="301" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#e5e7eb">/v1/responses</text>
    <text x="78" y="325" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#a78bfa">OpenAI Responses</text>
    <text x="78" y="346" font-family="Inter,Arial,sans-serif" font-size="11" fill="#8b93a5">Codex CLI · Agents SDK</text>
  </g>
  <g>
    <rect x="58" y="368" width="230" height="86" rx="14" fill="#0e0e16" stroke="#ffffff" stroke-opacity=".09"/>
    <rect x="58" y="368" width="3" height="86" rx="1.5" fill="#cc7c5e"/>
    <text x="78" y="397" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#e5e7eb">/v1/messages</text>
    <text x="78" y="421" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#f0a58a">Anthropic Messages</text>
    <text x="78" y="442" font-family="Inter,Arial,sans-serif" font-size="11" fill="#8b93a5">Claude Code · anthropic SDK</text>
  </g>

  <!-- IR core -->
  <rect x="372" y="176" width="310" height="278" rx="18" fill="#0b0b14" stroke="#6366f1" stroke-opacity=".55" stroke-width="1.6"/>
  <text x="527" y="210" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13.5" letter-spacing="2" fill="#a5b4fc">CANONICAL IR</text>
  <line x1="392" y1="230" x2="662" y2="230" stroke="#312e81" stroke-width="1"/>
  <g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#94a3b8">
    <text x="392" y="258">wire decode → IRRequest</text>
    <text x="392" y="282">auth · budgets · rate limits</text>
    <text x="392" y="306">WRR key pools · retries</text>
    <text x="392" y="330">cooldowns · fallbacks</text>
    <text x="392" y="354">IRStreamDelta* → wire</text>
    <text x="392" y="378">re-encoded in caller dialect</text>
  </g>
  <line x1="392" y1="400" x2="662" y2="400" stroke="#312e81" stroke-width="1"/>
  <text x="527" y="430" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#a78bfa">no pairwise converters</text>

  <!-- connectors -->
  <g fill="none" stroke="url(#beam)" stroke-width="1.7">
    <path d="M 288 219 C 330 219 330 230 372 230"/>
    <path d="M 288 315 C 330 315 330 315 372 315"/>
    <path d="M 288 411 C 330 411 330 400 372 400"/>
    <path d="M 682 250 C 718 250 718 230 756 230"/>
    <path d="M 682 315 C 718 315 718 315 756 315"/>
    <path d="M 682 380 C 718 380 718 400 756 400"/>
  </g>

  <!-- provider panel -->
  <rect x="756" y="176" width="484" height="278" rx="18" fill="#0b0b14" stroke="#ffffff" stroke-opacity=".08"/>

  <g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#cbd5e1">
    <g><rect x="761" y="212" width="150" height="40" rx="9" fill="#101018" stroke="#ffffff" stroke-opacity=".08"/><text x="836" y="237" text-anchor="middle">openai</text></g>
    <g><rect x="923" y="212" width="150" height="40" rx="9" fill="#101018" stroke="#ffffff" stroke-opacity=".08"/><text x="998" y="237" text-anchor="middle">anthropic</text></g>
    <g><rect x="1085" y="212" width="150" height="40" rx="9" fill="#101018" stroke="#ffffff" stroke-opacity=".08"/><text x="1160" y="237" text-anchor="middle">gemini</text></g>

    <g><rect x="761" y="262" width="150" height="40" rx="9" fill="#101018" stroke="#ffffff" stroke-opacity=".08"/><text x="836" y="287" text-anchor="middle">openrouter</text></g>
    <g><rect x="923" y="262" width="150" height="40" rx="9" fill="#101018" stroke="#ffffff" stroke-opacity=".08"/><text x="998" y="287" text-anchor="middle">nvidia-nim</text></g>
    <g><rect x="1085" y="262" width="150" height="40" rx="9" fill="#101018" stroke="#ffffff" stroke-opacity=".08"/><text x="1160" y="287" text-anchor="middle">cline</text></g>

    <g><rect x="761" y="312" width="150" height="40" rx="9" fill="#101018" stroke="#ffffff" stroke-opacity=".08"/><text x="836" y="337" text-anchor="middle">workbuddy</text></g>
    <g><rect x="923" y="312" width="150" height="40" rx="9" fill="#101018" stroke="#ffffff" stroke-opacity=".08"/><text x="998" y="337" text-anchor="middle">gmicloud</text></g>
    <g><rect x="1085" y="312" width="150" height="40" rx="9" fill="#101018" stroke="#ffffff" stroke-opacity=".08"/><text x="1160" y="337" text-anchor="middle">bai</text></g>

    <g><rect x="761" y="362" width="150" height="40" rx="9" fill="#101018" stroke="#ffffff" stroke-opacity=".08"/><text x="836" y="387" text-anchor="middle">opencode</text></g>
    <g><rect x="923" y="362" width="150" height="40" rx="9" fill="#101018" stroke="#ffffff" stroke-opacity=".08"/><text x="998" y="387" text-anchor="middle">hermes</text></g>
    <g><rect x="1085" y="362" width="150" height="40" rx="9" fill="#151527" stroke="#a78bfa" stroke-opacity=".4"/><text x="1160" y="387" text-anchor="middle" fill="#a78bfa">+ yours</text></g>
  </g>
  <text x="998" y="428" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6b7280">any URL behind openai-compatible</text>

  <text x="640" y="482" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" fill="#8b93a5">Claude Code backed by GPT. Codex backed by Claude. One base_url — the client never learns.</text>
</svg>
