<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-label="Request lifecycle: decode, auth, rate limit, journal replay check, route, serve, encode — then the response returns in the caller's own dialect">
  <defs>
    <linearGradient id="life" gradientUnits="userSpaceOnUse" x1="43" y1="0" x2="1237" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
    <marker id="larw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="larw2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
    <style>
      .hl { fill: none; stroke: #c4b5fd; stroke-width: 1.6; opacity: 0; animation: lhl 6.3s linear infinite; }
      @keyframes lhl { 0% { opacity: .95; } 12% { opacity: 0; } 100% { opacity: 0; } }
      .flow { fill: none; stroke: #ddd6fe; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 5 11; animation: lflow .55s linear infinite; }
      @keyframes lflow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -16; } }
      .rflow { fill: none; stroke: #c4b5fd; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 16 84; animation: rflow 2.2s linear infinite; }
      @keyframes rflow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
      @media (prefers-reduced-motion: reduce) { .hl, .flow, .rflow { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="250" fill="#07070c"/>
  <text x="40" y="42" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" fill="#f4f4f6">One request, end to end</text>
  <text x="40" y="64" font-family="Inter,Arial,sans-serif" font-size="12.5" fill="#8b93a5">The pipeline run_chat_like names, in order. Start reading the codebase here.</text>

  <g>
    <rect x="43" y="92" width="150" height="78" rx="12" fill="#101018" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="59" y="112" font-family="ui-monospace,Menlo,monospace" font-size="9.5" fill="#6b7280">01</text>
    <text x="59" y="132" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e5e7eb">Decode</text>
    <text x="59" y="151" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#8b93a5">wire codec → IR</text>

    <rect x="217" y="92" width="150" height="78" rx="12" fill="#101018" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="233" y="112" font-family="ui-monospace,Menlo,monospace" font-size="9.5" fill="#6b7280">02</text>
    <text x="233" y="132" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e5e7eb">Auth</text>
    <text x="233" y="151" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#8b93a5">virtual key · budget</text>

    <rect x="391" y="92" width="150" height="78" rx="12" fill="#101018" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="407" y="112" font-family="ui-monospace,Menlo,monospace" font-size="9.5" fill="#6b7280">03</text>
    <text x="407" y="132" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e5e7eb">Rate limit</text>
    <text x="407" y="151" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#8b93a5">rpm · tpm window</text>

    <rect x="565" y="92" width="150" height="78" rx="12" fill="#101018" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="581" y="112" font-family="ui-monospace,Menlo,monospace" font-size="9.5" fill="#6b7280">04</text>
    <text x="581" y="132" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e5e7eb">Journal</text>
    <text x="581" y="151" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#8b93a5">replay on reconnect</text>

    <rect x="739" y="92" width="150" height="78" rx="12" fill="#151527" stroke="#6366f1" stroke-opacity=".45"/>
    <text x="755" y="112" font-family="ui-monospace,Menlo,monospace" font-size="9.5" fill="#818cf8">05</text>
    <text x="755" y="132" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#c7d2fe">Route</text>
    <text x="755" y="151" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#a5b4fc">WRR · retry · fallback</text>

    <rect x="913" y="92" width="150" height="78" rx="12" fill="#101018" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="929" y="112" font-family="ui-monospace,Menlo,monospace" font-size="9.5" fill="#6b7280">06</text>
    <text x="929" y="132" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e5e7eb">Serve</text>
    <text x="929" y="151" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#8b93a5">adapter · stream</text>

    <rect x="1087" y="92" width="150" height="78" rx="12" fill="#101018" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="1103" y="112" font-family="ui-monospace,Menlo,monospace" font-size="9.5" fill="#6b7280">07</text>
    <text x="1103" y="132" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e5e7eb">Encode</text>
    <text x="1103" y="151" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#8b93a5">IR deltas → SSE</text>
  </g>

  <g stroke="url(#life)" stroke-width="1.8" marker-end="url(#larw)" fill="none">
    <line x1="197" y1="131" x2="213" y2="131"/>
    <line x1="371" y1="131" x2="387" y2="131"/>
    <line x1="545" y1="131" x2="561" y2="131"/>
    <line x1="719" y1="131" x2="735" y2="131"/>
    <line x1="893" y1="131" x2="909" y2="131"/>
    <line x1="1067" y1="131" x2="1083" y2="131"/>
  </g>

  <path d="M 1162 172 C 1162 214 118 214 118 172" fill="none" stroke="url(#life)" stroke-width="1.8" marker-end="url(#larw2)" stroke-opacity=".8"/>
  <text x="640" y="234" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#a78bfa">response returns in the caller&#8217;s own dialect · every reply carries x-wiwi-request-id and x-wiwi-latency-ms</text>
<path class="rflow" d="M 1162 172 C 1162 214 118 214 118 172"/>
  <g>
    <rect class="hl" x="43" y="92" width="150" height="78" rx="12"/>
    <rect class="hl" style="animation-delay:.9s" x="217" y="92" width="150" height="78" rx="12"/>
    <rect class="hl" style="animation-delay:1.8s" x="391" y="92" width="150" height="78" rx="12"/>
    <rect class="hl" style="animation-delay:2.7s" x="565" y="92" width="150" height="78" rx="12"/>
    <rect class="hl" style="animation-delay:3.6s" x="739" y="92" width="150" height="78" rx="12"/>
    <rect class="hl" style="animation-delay:4.5s" x="913" y="92" width="150" height="78" rx="12"/>
    <rect class="hl" style="animation-delay:5.4s" x="1087" y="92" width="150" height="78" rx="12"/>
  </g>
  <g>
    <line class="flow" x1="197" y1="131" x2="213" y2="131"/>
    <line class="flow" style="animation-delay:-.09s" x1="371" y1="131" x2="387" y2="131"/>
    <line class="flow" style="animation-delay:-.18s" x1="545" y1="131" x2="561" y2="131"/>
    <line class="flow" style="animation-delay:-.27s" x1="719" y1="131" x2="735" y2="131"/>
    <line class="flow" style="animation-delay:-.36s" x1="893" y1="131" x2="909" y2="131"/>
    <line class="flow" style="animation-delay:-.45s" x1="1067" y1="131" x2="1083" y2="131"/>
  </g>
</svg>
