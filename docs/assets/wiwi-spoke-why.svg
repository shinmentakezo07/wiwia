<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="Comparison: pairwise converters need one module per pair, while hub-and-spoke needs one per dialect plus one per provider">
  <defs>
    <radialGradient id="sa" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#6366f1" stop-opacity=".22"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="sb" cx="14%" cy="60%" r="55%"><stop offset="0" stop-color="#ef4444" stop-opacity=".13"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
    <style>
      .irp { animation: swpulse 4s ease-in-out infinite; }
      @keyframes swpulse { 0%, 100% { stroke-opacity: .5; } 50% { stroke-opacity: 1; } }
      .flow { fill: none; stroke: #ddd6fe; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 6 12; animation: swflow .9s linear infinite; }
      @keyframes swflow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -18; } }
      @media (prefers-reduced-motion: reduce) { .irp, .flow { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="470" fill="#07070c"/>
  <rect width="1280" height="470" fill="url(#sa)"/>
  <rect width="1280" height="470" fill="url(#sb)"/>

  <text x="40" y="46" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" fill="#f4f4f6">Why there are no pairwise converters</text>
  <text x="40" y="68" font-family="Inter,Arial,sans-serif" font-size="12.5" fill="#8b93a5">Left: every dialect × provider pair is its own module. Right: the IR absorbs the matrix.</text>

  <!-- LEFT PANEL -->
  <rect x="60" y="96" width="540" height="354" rx="16" fill="#0c0c13" stroke="#ef4444" stroke-opacity=".22"/>
  <text x="88" y="130" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#f87171">✕  Pairwise converters</text>
  <text x="88" y="150" font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#6b7280">N × M hand-written modules, each separately tested</text>

  <g font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#6b7280">
    <text x="193" y="176" text-anchor="middle">chat</text>
    <text x="345" y="176" text-anchor="middle">responses</text>
    <text x="497" y="176" text-anchor="middle">messages</text>
    <text x="112" y="218" text-anchor="end">openai</text>
    <text x="112" y="294" text-anchor="end">anthropic</text>
    <text x="112" y="370" text-anchor="end">gemini</text>
  </g>

  <g>
    <rect x="123" y="186" width="140" height="64" rx="10" fill="#16121a" stroke="#ef4444" stroke-opacity=".28"/>
    <line x1="133" y1="196" x2="253" y2="240" stroke="#ef4444" stroke-opacity=".45" stroke-width="1.4"/>
    <rect x="275" y="186" width="140" height="64" rx="10" fill="#16121a" stroke="#ef4444" stroke-opacity=".28"/>
    <line x1="285" y1="196" x2="405" y2="240" stroke="#ef4444" stroke-opacity=".45" stroke-width="1.4"/>
    <rect x="427" y="186" width="140" height="64" rx="10" fill="#16121a" stroke="#ef4444" stroke-opacity=".28"/>
    <line x1="437" y1="196" x2="557" y2="240" stroke="#ef4444" stroke-opacity=".45" stroke-width="1.4"/>

    <rect x="123" y="262" width="140" height="64" rx="10" fill="#16121a" stroke="#ef4444" stroke-opacity=".28"/>
    <line x1="133" y1="272" x2="253" y2="316" stroke="#ef4444" stroke-opacity=".45" stroke-width="1.4"/>
    <rect x="275" y="262" width="140" height="64" rx="10" fill="#16121a" stroke="#ef4444" stroke-opacity=".28"/>
    <line x1="285" y1="272" x2="405" y2="316" stroke="#ef4444" stroke-opacity=".45" stroke-width="1.4"/>
    <rect x="427" y="262" width="140" height="64" rx="10" fill="#16121a" stroke="#ef4444" stroke-opacity=".28"/>
    <line x1="437" y1="272" x2="557" y2="316" stroke="#ef4444" stroke-opacity=".45" stroke-width="1.4"/>

    <rect x="123" y="338" width="140" height="64" rx="10" fill="#16121a" stroke="#ef4444" stroke-opacity=".28"/>
    <line x1="133" y1="348" x2="253" y2="392" stroke="#ef4444" stroke-opacity=".45" stroke-width="1.4"/>
    <rect x="275" y="338" width="140" height="64" rx="10" fill="#16121a" stroke="#ef4444" stroke-opacity=".28"/>
    <line x1="285" y1="348" x2="405" y2="392" stroke="#ef4444" stroke-opacity=".45" stroke-width="1.4"/>
    <rect x="427" y="338" width="140" height="64" rx="10" fill="#16121a" stroke="#ef4444" stroke-opacity=".28"/>
    <line x1="437" y1="348" x2="557" y2="392" stroke="#ef4444" stroke-opacity=".45" stroke-width="1.4"/>
  </g>
  <text x="330" y="424" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#f87171">9 modules here → 36 across 12 providers</text>

  <!-- RIGHT PANEL -->
  <rect x="680" y="96" width="540" height="354" rx="16" fill="#0c0c13" stroke="#6366f1" stroke-opacity=".35"/>
  <text x="708" y="130" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#a78bfa">✓  Hub and spoke</text>
  <text x="708" y="150" font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#6b7280">One module per dialect, one per provider</text>

  <g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#cbd5e1">
    <rect x="706" y="176" width="140" height="36" rx="9" fill="#101018" stroke="#10a37f" stroke-opacity=".45"/>
    <text x="776" y="199" text-anchor="middle">chat</text>
    <rect x="860" y="176" width="140" height="36" rx="9" fill="#101018" stroke="#a78bfa" stroke-opacity=".45"/>
    <text x="930" y="199" text-anchor="middle">responses</text>
    <rect x="1014" y="176" width="140" height="36" rx="9" fill="#101018" stroke="#cc7c5e" stroke-opacity=".45"/>
    <text x="1084" y="199" text-anchor="middle">messages</text>
  </g>

  <g stroke="#a78bfa" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#arw)" fill="none">
    <line x1="776" y1="212" x2="776" y2="246"/>
    <line x1="930" y1="212" x2="930" y2="246"/>
    <line x1="1084" y1="212" x2="1084" y2="246"/>
  </g>

  <rect x="706" y="250" width="448" height="54" rx="12" fill="#151527" stroke="#6366f1" stroke-opacity=".6" stroke-width="1.5"/>
  <text x="930" y="284" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14" letter-spacing="2" fill="#a5b4fc">CANONICAL IR</text>

  <line x1="930" y1="304" x2="930" y2="336" stroke="#a78bfa" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="700" y1="340" x2="1199" y2="340" stroke="url(#sbus)" stroke-width="1.6"/>
  <defs>
    <linearGradient id="sbus" x1="700" y1="0" x2="1199" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6366f1" stop-opacity=".55"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef" stop-opacity=".55"/></linearGradient>
  </defs>
  <g stroke="#a78bfa" stroke-opacity=".35" stroke-width="1.2">
    <line x1="700" y1="340" x2="700" y2="369"/><line x1="745" y1="340" x2="745" y2="369"/>
    <line x1="791" y1="340" x2="791" y2="369"/><line x1="836" y1="340" x2="836" y2="369"/>
    <line x1="881" y1="340" x2="881" y2="369"/><line x1="927" y1="340" x2="927" y2="369"/>
    <line x1="972" y1="340" x2="972" y2="369"/><line x1="1018" y1="340" x2="1018" y2="369"/>
    <line x1="1063" y1="340" x2="1063" y2="369"/><line x1="1108" y1="340" x2="1108" y2="369"/>
    <line x1="1154" y1="340" x2="1154" y2="369"/><line x1="1199" y1="340" x2="1199" y2="369"/>
  </g>
  <g fill="#8b5cf6" fill-opacity=".55" stroke="#c4b5fd" stroke-opacity=".35">
    <circle cx="700" cy="380" r="11"/><circle cx="745" cy="380" r="11"/><circle cx="791" cy="380" r="11"/>
    <circle cx="836" cy="380" r="11"/><circle cx="881" cy="380" r="11"/><circle cx="927" cy="380" r="11"/>
    <circle cx="972" cy="380" r="11"/><circle cx="1018" cy="380" r="11"/><circle cx="1063" cy="380" r="11"/>
    <circle cx="1108" cy="380" r="11"/><circle cx="1154" cy="380" r="11"/><circle cx="1199" cy="380" r="11"/>
  </g>
  <text x="930" y="424" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#a78bfa">3 codecs + 12 adapters = 15 modules</text>
<rect class="irp" x="706" y="250" width="448" height="54" rx="12" fill="none" stroke="#a5b4fc" stroke-width="1.5"/>
  <g>
    <line class="flow" x1="776" y1="212" x2="776" y2="246"/>
    <line class="flow" style="animation-delay:-.3s" x1="930" y1="212" x2="930" y2="246"/>
    <line class="flow" style="animation-delay:-.6s" x1="1084" y1="212" x2="1084" y2="246"/>
    <line class="flow" style="animation-delay:-.15s" x1="930" y1="304" x2="930" y2="336"/>
  </g>
</svg>
