[project]
name = "wiwi"
version = "0.1.0"
description = "wiwi — unified LLM gateway proxy (OpenAI Chat/Responses + Anthropic Messages in, any provider out)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx[http2]>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "structlog>=24.1",
  "orjson>=3.10",
  "python-dotenv>=1.0",
  # Accurate token counts for OpenAI-family models, used by the cost engine
  # (wiwi/cost/pricing.py). The code path was already there but the dependency
  # was not declared, so it worked only when some unrelated package happened to
  # drag tiktoken into the environment — a clean `uv sync` silently fell back to
  # the chars/4 heuristic and degraded cost/budget accounting. Declared so the
  # fallback is a deliberate choice, not an accident.
  "tiktoken>=0.7",
  # The /v1/realtime WebSocket relay (spec E). Client-side only — the upstream
  # hop is a raw websocket connection, not an httpx call.
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "asgi-lifespan>=2.1",
  "ruff>=0.4",
  "hypothesis>=6.100",
  # Parallel test runs (`pytest -n auto`).
  "pytest-xdist>=3.5",
  # Random test order to surface leaked cache/singleton state between tests.
  "pytest-randomly>=3.15",
  # Hot-path micro-benchmarks (tests/bench/, run with --benchmark-only).
  "pytest-benchmark>=4.0",
  # Dependency hygiene: known CVEs and declared-vs-imported drift.
  "pip-audit>=2.7",
  "deptry>=0.20",
]
redis = ["redis>=5.0"]
otel = [
  "opentelemetry-api>=1.45.2",
  "opentelemetry-sdk>=1.20",
  "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[project.scripts]
wiwi = "wiwi.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wiwi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.deptry]
known_first_party = ["wiwi"]
# Dev/test tooling is never imported by wiwi/ itself.
pep621_dev_dependency_groups = ["dev"]

[tool.deptry.per_rule_ignores]
# aiosqlite/asyncpg are loaded by SQLAlchemy from the DATABASE_URL dialect,
# and the otel sdk/exporter are imported lazily, so no static import exists.
DEP002 = [
  "aiosqlite",
  "asyncpg",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
]
# starlette ships with FastAPI and its version is pinned by FastAPI's range.
DEP003 = ["starlette"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# EXE002 fires on every file here: the workspace mount marks all files +x while
# git tracks 100644 (core.filemode=false), so the bit is meaningless in this env.
ignore = ["EXE002"]
