services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wiwi
      POSTGRES_PASSWORD: wiwi
      POSTGRES_DB: wiwi
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiwi -d wiwi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  wiwi:
    build: .
    ports: ["4000:4000"]
    env_file: [.env]
    environment:
      WIWI_MASTER_KEY: ${WIWI_MASTER_KEY:-sk-wiwi-master-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://wiwi:wiwi@postgres:5432/wiwi}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    # If wiwi.yaml exists on the host, mount it; otherwise the container
    # ships with wiwi.yaml.example as /app/wiwi.yaml. Set env vars to
    # activate providers; absent keys are filtered at load time.
    volumes:
      - wiwi_data:/app/data
      # Uncomment to mount a custom config:
      # - ./wiwi.yaml:/app/wiwi.yaml:ro
    command: ["--config", "/app/wiwi.yaml", "--host", "0.0.0.0", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  wiwi_data:
