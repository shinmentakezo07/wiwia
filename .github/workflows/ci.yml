name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python (ruff, audit lint, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check wiwi/ tests/ scripts/

      - name: Audit register
        run: python3 scripts/audit_lint.py

      - name: Pytest
        run: python3 -m pytest tests/ -q

  go:
    name: go (vet, test, shared-db interop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: wiwi-go/go.mod
          cache-dependency-path: wiwi-go/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (python gate deps, for the shared-db suite)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Vet
        run: go vet ./...
        working-directory: wiwi-go

      - name: Test
        run: go test ./...
        working-directory: wiwi-go

      # The cross-backend suite: Python seeds one SQLite DB, the Go helper
      # binary built from wiwi-go/cmd/shared-db-interop reads and writes the
      # same file, each side verifies the other's rows.
      - name: Shared-DB interop (pytest drives the Go binary)
        run: python3 -m pytest tests/test_shared_db_go.py -q

  web:
    name: web (lint, test, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `npm run build` is `tsc -b && vite build`, so this is also the typecheck.
      - name: Build
        run: npm run build
